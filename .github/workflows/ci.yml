name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'THIRD_PARTY_NOTICES.md'
  # No paths-ignore on pull_request: a skipped workflow would leave a required
  # status check pending and block the merge.
  pull_request:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # setup-bun caches the bun install cache keyed on bun.lock by default.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # dist is committed and shipped to users, so a stale dist would silently
      # install old code. Compare a fresh out-of-tree build against it.
      # The build script deliberately avoids npm lifecycle names such as
      # "build"/"prepare": pacote runs a git preparation step for those, which
      # re-executes the OpenCode binary and fails on compiled builds.
      - run: rm -rf build-check && CREW_BUILD_OUTDIR=build-check bun run compile && diff -r dist build-check
