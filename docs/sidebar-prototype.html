<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Crew · Sidebar</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#090909;
    --bg-base:#0b0b0b;
    --bg-raised:#111111;
    --border:#222222;
    --scrollbar:#2f2f2f;
    --text-base:#d6d6d6;
    --text-muted:#909090;
    --text-faint:#585858;
    --info:#809bb5;
    --warning:#c5a15f;
    --error:#c47a70;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","PingFang SC","Noto Sans CJK SC",monospace;
    /* One terminal cell: 1 row = 1 line-height, 1 column = 1ch. */
    --row:1.5em;
  }
  *{box-sizing:border-box}
  html{font-size:12px}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text-base);
    font-family:var(--mono);
    font-size:12px;
    line-height:var(--row);
    -webkit-font-smoothing:antialiased;
  }
  button,a{font:inherit;color:inherit}
  b{font-weight:700}
  .base{color:var(--text-base)}
  .muted{color:var(--text-muted)}
  .faint{color:var(--text-faint)}
  .info{color:var(--info)}
  .warning{color:var(--warning)}
  .error{color:var(--error)}

  .wrap{max-width:1180px;margin:0 auto;padding:var(--row) 2ch}
  .top{display:flex;align-items:center;gap:1ch;margin-bottom:var(--row);color:var(--text-faint);white-space:nowrap}
  .top .name{color:var(--text-muted)}
  .switch{margin-left:auto;display:flex;align-items:center;gap:1ch}
  .switch button{appearance:none;border:0;background:none;padding:0;color:var(--text-faint);cursor:pointer}
  .switch button:hover{color:var(--text-muted)}
  .switch button.on{color:var(--text-base);text-decoration:underline;text-underline-offset:3px}

  .term{
    display:grid;
    grid-template-columns:minmax(0,1fr) 42ch;
    height:calc(var(--row) * 31);
    border:1px solid var(--border);
    background:var(--bg-base);
    overflow:hidden;
  }

  .chat{display:flex;flex-direction:column;min-width:0;padding:var(--row) 2ch 0;overflow:hidden}
  .chat .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turn{margin-top:var(--row)}
  .tool{display:grid;grid-template-columns:2ch 10ch 18ch 9ch minmax(0,1fr);white-space:nowrap}
  .tool > span{overflow:hidden;text-overflow:ellipsis}
  .composer{margin-top:auto;padding:var(--row) 0;border-top:1px solid var(--border)}
  .caret{display:inline-block;width:1ch;height:1em;vertical-align:-0.15em;background:#737373;opacity:.75;animation:blink 1.2s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}

  .side{display:flex;flex-direction:column;width:42ch;min-width:0;min-height:0;padding:var(--row) 2ch;background:var(--bg-raised);overflow:hidden}
  .side .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .side-title{flex:none;padding:0 2ch var(--row) 0}
  .content-wrap{position:relative;flex:1;min-height:0}
  .content{height:100%;overflow-x:hidden;overflow-y:auto;padding-right:1ch;scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .thumb{position:absolute;right:0;top:0;width:1ch;background:var(--scrollbar);display:none}
  .block + .block{margin-top:var(--row)}
  .split{display:flex}
  .split > .l{flex:1 1 auto}
  .split > .r{flex:none;margin-left:1ch}

  .alert{display:grid;grid-template-columns:1ch 13ch minmax(0,1fr);column-gap:1ch;text-decoration:none;cursor:pointer;white-space:nowrap}
  .alert > span{overflow:hidden;text-overflow:ellipsis}
  .alert:hover > span{text-decoration:underline;text-underline-offset:3px}
  .dl{display:grid;grid-template-columns:10ch minmax(0,1fr) 6ch;column-gap:1ch}
  .dl > span, .ct-head > span, .sa > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .dl > span:last-child{text-align:right}
  .ct-head{display:grid;grid-template-columns:minmax(0,1fr) auto 6ch;column-gap:1ch}
  .ct-head > span:last-child{text-align:right}
  .sa{display:grid;grid-template-columns:10ch 7ch 10ch 10ch}
  .sa > span:nth-child(n+2){text-align:right}

  .todo-head{cursor:default;user-select:none}
  .todo-head.toggle{cursor:pointer}
  .todo-item{display:flex}
  .todo-item .mark{flex:none;white-space:pre}
  .todo-item .txt{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .todo-item.cancelled .txt{text-decoration:line-through}

  .side-foot{flex:none;padding-top:var(--row);color:var(--text-muted)}
  .side-foot .ln{cursor:default}
  .side-foot .ln:hover{color:var(--text-base)}

  .foot{margin-top:var(--row);display:flex;justify-content:space-between;gap:2ch;color:var(--text-faint)}
  @media (max-width:980px){
    .wrap{padding:var(--row) 1ch}
    .top{flex-wrap:wrap}
    .term{grid-template-columns:minmax(0,1fr);height:auto}
    .chat{min-height:calc(var(--row) * 20);border-bottom:1px solid var(--border)}
    .side{width:auto;height:calc(var(--row) * 31)}
    .foot{flex-direction:column;gap:0}
  }
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Port of OpenCode's FilePath/truncateFilePath (POSIX paths only) with a CJK-aware cell width.
const graphemes = s => Array.from(new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(s), x => x.segment);
const cellWidth = s => graphemes(s).reduce((w, g) => w + (/[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe4f\uff00-\uff60\uffe0-\uffe6]/u.test(g) ? 2 : 1), 0);
const take = (s, max, reverse) => {
  const segs = graphemes(s); if (reverse) segs.reverse();
  const out = []; let w = 0;
  for (const g of segs) { const n = cellWidth(g); if (w + n > max) break; out.push(g); w += n; }
  if (reverse) out.reverse();
  return out.join('');
};
const truncateBasename = (v, max) => {
  if (cellWidth(v) <= max) return v;
  if (max <= 1) return take('…', max);
  const dot = v.lastIndexOf('.');
  const ext = dot > 0 ? v.slice(dot) : '';
  if (cellWidth(ext) >= max) return '…' + take(ext, max - 1, true);
  const stem = ext ? v.slice(0, dot) : v;
  return take(stem, max - cellWidth(ext) - 1) + '…' + ext;
};
const truncateFilePath = (value, max) => {
  if (cellWidth(value) <= max) return value;
  const root = value.startsWith('/') ? '/' : '';
  const segs = value.slice(root.length).split('/').filter(Boolean);
  const basename = segs.at(-1) ?? value;
  if (segs.length < 2) return root + truncateBasename(basename, max - cellWidth(root));
  const prefix = root + '…/';
  const room = max - cellWidth(prefix);
  if (room <= 0) return take(prefix, max);
  const compact = truncateBasename(basename, room);
  if (compact !== basename) return prefix + compact;
  const selected = [basename];
  let w = cellWidth(prefix + basename);
  for (let i = segs.length - 2; i >= 0; i--) {
    const next = cellWidth(segs[i]) + 1;
    if (w + next > max) { const avail = max - w - 1; if (avail > 1) selected.unshift(take(segs[i], avail - 1) + '…'); break; }
    selected.unshift(segs[i]); w += next;
  }
  return prefix + selected.join('/');
};

const TODO_MARK = {completed:'[✓]', in_progress:'[•]', cancelled:'[-]', pending:'[ ]'};
const todoColor = s => s === 'in_progress' ? 'warning' : s === 'cancelled' ? 'faint' : 'muted';
const money = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'});

let todoOpen = true;

function renderAlerts(alerts) {
  if (!alerts.length) return '';
  const rows = alerts.map(a => {
    const tone = a.kind === 'failed' ? 'error' : 'warning';
    const label = a.kind === 'permission' ? '权限' : a.kind;
    return `<a class="alert ln" href="#" data-task="${esc(a.task)}" title="打开任务会话 ${esc(a.task)}">`
      + `<span class="${tone}">!</span><span class="base">${esc(a.task)}</span>`
      + `<span><span class="${tone}">${esc(label)}</span> <span class="muted">${esc(a.text)}</span></span></a>`;
  }).join('');
  return `<div class="block alerts">${rows}</div>`;
}

const limitOf = d => d.limit ?? STEP_LIMIT[d.role] ?? STEP_LIMIT.engineer;
const overBudget = (steps, limit) => steps >= limit * WARN_STEP_RATIO;

function renderDelegation(d) {
  const limit = limitOf(d);
  const warn = d.stall || overBudget(d.steps, limit);
  const act = d.stall ? `无输出 ${d.stall}` : d.activity;
  return `<div class="dl ln${warn ? ' warning' : ''}">`
    + `<span class="${warn ? '' : 'base'}" style="padding-left:${d.depth * 2}ch">${esc(d.role)}</span>`
    + `<span class="${warn ? '' : 'info'}">${esc(act)}</span>`
    + `<span class="${warn ? '' : 'faint'}">~${d.steps}/${limit}</span></div>`;
}

function renderCrewTask(t) {
  const limit = STEP_LIMIT.engineer;
  const warn = overBudget(t.steps, limit);
  let key, val;
  if (t.status === 'progress' || t.status === 'waiting') { key = 'check'; val = t.check; }
  else if (t.status === 'ready') { key = 'next'; val = 'Root 验收证据'; }
  else { key = 'next'; val = t.next; }
  // The Report status keeps its own color even when the row is over budget, so failed/blocked stay red.
  return `<div class="ct" id="task-${esc(t.id)}">`
    + `<div class="ct-head ln"><span class="${warn ? 'warning' : 'base'}">${esc(t.id)}</span>`
    + `<span class="${STATUS_COLOR[t.status]}">${t.status}</span>`
    + `<span class="${warn ? 'warning' : 'faint'}">~${t.steps}/${limit}</span></div>`
    + `<div class="ln"><span class="faint">${key}</span> <span class="muted">${esc(val)}</span></div></div>`;
}

function renderDelegations(d) {
  const tasks = d.tasks.filter(t => t.status !== 'dropped');
  if (!d.running.length && !tasks.length) return '';
  const running = d.running.length + tasks.filter(t => t.status === 'progress' || t.status === 'waiting').length;
  return `<div class="block delegations"><div class="ln"><b class="base">Delegations</b><span class="muted"> (${running} running)</span></div>`
    + d.running.map(renderDelegation).join('')
    + tasks.map(renderCrewTask).join('')
    + `</div>`;
}

const compactTokens = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);

// Illustrative anomaly rule: any session hit its step limit, or sessions / tokens / cost are at least
// double the next-highest role (with absolute floors so a small session does not light up).
function subagentAnomalies(list) {
  const second = (key, role) => Math.max(0, ...list.filter(x => x.role !== role).map(x => x[key]));
  return new Set(list.filter(x =>
    (x.fullSteps ?? 0) > 0
    || (x.sessions >= 5 && x.sessions >= 2 * second('sessions', x.role))
    || (x.tokens >= 500000 && x.tokens >= 2 * second('tokens', x.role))
    || (x.cost >= 1 && x.cost >= 2 * second('cost', x.role))
  ).map(x => x.role));
}

function renderSubagents(list) {
  const used = list.filter(x => x.sessions > 0);
  if (!used.length) return '';
  const warn = subagentAnomalies(used);
  const total = used.reduce((n, x) => n + x.sessions, 0);
  const cost = used.reduce((n, x) => n + x.cost, 0);
  return `<div class="block subagents"><div class="ln"><b class="base">Subagents</b><span class="muted"> (${total} session${total === 1 ? '' : 's'} · ${money.format(cost)})</span></div>`
    + `<div class="sa ln faint"><span></span><span>sess </span><span>tokens</span><span>cost</span></div>`
    + used.map(x => {
      const w = warn.has(x.role);
      return `<div class="sa ln ${w ? 'warning' : 'muted'}"><span class="${w ? '' : 'base'}">${esc(x.role)}</span><span>${x.sessions} </span><span>${compactTokens(x.tokens)}</span><span>${money.format(x.cost)}</span></div>`;
    }).join('')
    + `</div>`;
}

function renderTodo(list) {
  if (!list.length) return '';
  const many = list.length > 2;
  const remaining = list.filter(t => t.status === 'pending' || t.status === 'in_progress').length;
  const head = `<div class="todo-head ln${many ? ' toggle' : ''}" id="todo-head">`
    + (many ? `<span class="base">${todoOpen ? '▼' : '▶'}</span> ` : '')
    + `<b class="base">Todo</b>`
    + (many && !todoOpen ? `<span class="muted"> (${remaining} remaining)</span>` : '')
    + `</div>`;
  const items = (!many || todoOpen) ? list.map(t =>
    `<div class="todo-item ${t.status.replace('_', '-')} ${todoColor(t.status)}"><span class="mark">${TODO_MARK[t.status]} </span><span class="txt">${esc(t.content)}</span></div>`
  ).join('') : '';
  return `<div class="block todo">${head}${items}</div>`;
}

function renderContext(c) {
  return `<div class="block context"><div class="ln"><b class="base">Context</b></div>`
    + `<div class="ln muted">${c.tokens.toLocaleString('en-US')} tokens</div>`
    + `<div class="ln muted">${c.percent}% used</div>`
    + `<div class="ln muted">${money.format(c.cost)} spent</div></div>`;
}

function renderChat(s) {
  const c = s.chat;
  const tools = c.tools.map(t =>
    `<div class="tool"><span class="faint">·</span><span class="muted">${esc(t.name)}</span><span class="base">${esc(t.target)}</span><span class="${CHAT_COLOR[t.state]}">${t.state}</span><span class="${t.warn ? 'warning' : 'faint'}">${esc(t.detail)}</span></div>`
  ).join('');
  return `<div class="ln faint">${esc(s.title)}</div>`
    + `<div class="turn"><div class="ln base"><span class="faint">&gt;</span> ${esc(c.user)}</div></div>`
    + `<div class="turn"><div class="ln faint">${esc(c.meta)}</div>`
    + `<div class="ln muted">${esc(c.reply)}</div>${tools}</div>`
    + `<div class="composer"><div class="ln faint"><span class="muted">&gt;</span> 问 crew，或输入 / 查看命令 <span class="caret"></span></div></div>`;
}

function updateThumb() {
  const content = document.getElementById('content');
  const thumb = document.getElementById('thumb');
  const {scrollHeight:sh, clientHeight:ch, scrollTop:st} = content;
  if (sh <= ch) { thumb.style.display = 'none'; return; }
  const h = Math.max(ch * ch / sh, 12);
  thumb.style.display = 'block';
  thumb.style.height = h + 'px';
  thumb.style.top = (st / (sh - ch)) * (ch - h) + 'px';
}

function render() {
  const s = STATES[current];
  document.getElementById('chat').innerHTML = renderChat(s);
  const title = document.getElementById('side-title');
  title.innerHTML = `<b>${esc(s.title)}</b>`;
  title.title = s.title;
  document.getElementById('content').innerHTML =
    renderAlerts(s.alerts) + renderDelegations(s.delegations) + renderSubagents(s.subagents) + renderTodo(s.todos) + renderContext(s.context);
  const loc = `${s.path}:${s.branch}`;
  document.getElementById('side-foot').innerHTML = `<div class="ln" title="${esc(loc)}">${esc(truncateFilePath(loc, 38))}</div>`;
  document.getElementById('term').dataset.state = current;
  for (const b of document.querySelectorAll('#switch button')) b.classList.toggle('on', b.dataset.state === current);
  const head = document.getElementById('todo-head');
  if (head && head.classList.contains('toggle')) head.addEventListener('mousedown', () => { todoOpen = !todoOpen; render(); });
  for (const a of document.querySelectorAll('.alert')) a.addEventListener('click', e => e.preventDefault());
  document.getElementById('content').scrollTop = 0;
  updateThumb();
}

function setState(name) {
  if (!STATES[name]) name = 'active';
  current = name;
  todoOpen = true;
  const url = new URL(location.href);
  url.searchParams.set('state', name);
  history.replaceState(null, '', url);
  render();
}

document.getElementById('switch').innerHTML = Object.keys(STATES)
  .map(n => `<button type="button" data-state="${n}">${n}</button>`).join('<span class="faint">/</span>');
for (const b of document.querySelectorAll('#switch button')) b.addEventListener('click', () => setState(b.dataset.state));
document.getElementById('content').addEventListener('scroll', updateThumb);
window.addEventListener('resize', updateThumb);
setState(new URLSearchParams(location.search).get('state') || 'active');
</script>
</body>
</html>
