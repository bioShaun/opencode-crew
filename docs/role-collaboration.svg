<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1120" height="720" fill="#fafbfc"/>

  <!-- title -->
  <text x="56" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">OpenCode Crew · 角色协作</text>
  <text x="56" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Root 可直做；专家按需委派，不必全员参与</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="470" y="100" width="180" height="44" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="560" y="127" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">用户</text>

  <!-- line user to root -->
  <line x1="560" y1="144" x2="560" y2="176" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Root -->
  <g filter="url(#shadow)">
    <rect x="400" y="176" width="320" height="72" rx="16" fill="#0f766e"/>
  </g>
  <text x="560" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff">Root</text>
  <text x="560" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ccfbf1">决策 · 执行 · 验收</text>

  <!-- fork lines -->
  <path d="M560 248 L560 270 L300 270 L300 300" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M560 248 L560 270 L820 270 L820 300" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <rect x="318" y="252" width="72" height="22" rx="11" fill="#ecfdf5"/>
  <text x="354" y="267" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f766e">简单明确</text>
  <rect x="790" y="252" width="64" height="22" rx="11" fill="#fffbeb"/>
  <text x="822" y="267" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">复杂任务</text>

  <!-- left: direct -->
  <g filter="url(#shadow)">
    <rect x="190" y="300" width="220" height="64" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>
  <!-- check icon -->
  <circle cx="226" cy="332" r="12" fill="#10b981"/>
  <path d="M220 332 l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="328" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">直做并验证</text>
  <text x="250" y="348" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#047857">无需委派专家</text>

  <line x1="300" y1="364" x2="300" y2="620" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- right: delegate -->
  <g filter="url(#shadow)">
    <rect x="690" y="300" width="260" height="64" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <rect x="714" y="318" width="28" height="28" rx="8" fill="#fbbf24"/>
  <text x="728" y="337" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#78350f">↕</text>
  <text x="756" y="328" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#92400e">按需委派 · 可缺席</text>
  <text x="756" y="348" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#b45309">不是固定流水线</text>

  <!-- specialists -->
  <!-- connectors from delegate box -->
  <path d="M760 364 L760 390 L520 390 L520 420" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <path d="M800 364 L800 390 L680 390 L680 420" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <path d="M840 364 L840 390 L840 420" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <path d="M880 364 L880 390 L1000 390 L1000 420" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>

  <rect x="620" y="372" width="52" height="16" rx="8" fill="#f1f5f9"/>
  <text x="646" y="384" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b">optional</text>

  <!-- four cards -->
  <g filter="url(#shadow)">
    <rect x="450" y="420" width="140" height="70" rx="12" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <circle cx="478" cy="445" r="12" fill="#3b82f6"/>
  <!-- blueprint / plan -->
  <rect x="471.5" y="438.5" width="13" height="13" rx="1.5" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M474 442.5 h8 M474 445.5 h6 M474 448.5 h7" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="498" y="450" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">architect</text>
  <text x="520" y="472" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">方案设计</text>

  <g filter="url(#shadow)">
    <rect x="610" y="420" width="140" height="70" rx="12" fill="#fff" stroke="#ddd6fe" stroke-width="1.5"/>
  </g>
  <circle cx="638" cy="445" r="12" fill="#8b5cf6"/>
  <!-- wrench + gear hybrid: angle bracket tool -->
  <path d="M632 441 L628 445 L632 449" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M644 441 L648 445 L644 449" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="635" y1="448" x2="641" y2="442" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="658" y="450" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">engineer</text>
  <text x="680" y="472" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">实现与测试</text>

  <g filter="url(#shadow)">
    <rect x="770" y="420" width="140" height="70" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <circle cx="798" cy="445" r="12" fill="#64748b"/>
  <circle cx="796" cy="443" r="5" fill="none" stroke="#fff" stroke-width="1.7"/>
  <line x1="800" y1="447" x2="805" y2="452" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  <text x="818" y="450" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">explorer</text>
  <text x="840" y="472" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">只读探索</text>

  <g filter="url(#shadow)">
    <rect x="930" y="420" width="140" height="70" rx="12" fill="#fff" stroke="#fecdd3" stroke-width="1.5"/>
  </g>
  <circle cx="958" cy="445" r="12" fill="#e11d48"/>
  <!-- shield -->
  <path d="M958 437.5 c4 1.2 7 2.2 7 2.2 v6.2 c0 4.2-3.2 7.2-7 8.8 c-3.8-1.6-7-4.6-7-8.8 v-6.2 s3-1 7-2.2z" fill="none" stroke="#fff" stroke-width="1.4"/>
  <path d="M954.5 445 l2.8 2.8 5.2-5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="978" y="450" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9f1239">reviewer</text>
  <text x="1000" y="472" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">独立核查</text>

  <!-- converge to Root check -->
  <path d="M520 490 L520 530 L820 530" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M680 490 L680 530" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M840 490 L840 530" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M1000 490 L1000 530 L820 530" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <line x1="820" y1="530" x2="820" y2="556" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <g filter="url(#shadow)">
    <rect x="700" y="556" width="240" height="52" rx="14" fill="#0f766e"/>
  </g>
  <text x="820" y="588" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">Root 核查后交付</text>

  <line x1="820" y1="608" x2="820" y2="636" stroke="#0d9488" stroke-width="2.5"/>
  <path d="M820 636 L300 636" fill="none" stroke="#0d9488" stroke-width="2.5"/>

  <!-- deliver -->
  <g filter="url(#shadow)">
    <rect x="210" y="620" width="180" height="44" rx="22" fill="#1e293b"/>
  </g>
  <text x="300" y="648" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">交付</text>

  <!-- legend -->
  <line x1="56" y1="680" x2="90" y2="680" stroke="#0d9488" stroke-width="2.5"/>
  <text x="98" y="684" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">主路径</text>
  <line x1="160" y1="680" x2="194" y2="680" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="202" y="684" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">按需 / optional</text>
  <rect x="320" y="670" width="18" height="18" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="346" y="684" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">可缺席</text>
</svg>
